{% set name = "litestar" %}
{% set version = "2.21.1" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 28301438de7c5e77bb68a5d8684dff415b9f252b0dd8413b356e8e6794c6863a

build:
  number: 0
  skip: true  # [py<38]
  # because of missing httpx for s390x
  skip: true  # [s390x]

requirements:
  host:
    - python
  run:
    - python

outputs:
  - name: litestar
    build:
      skip: true  # [py<38]
      script:
        - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
      entry_points:
        - litestar = litestar.__main__:run_cli
    requirements:
      host:
        - pip
        - hatchling
        - python
      run:
        - python
        - anyio >=3
        - httpx >=0.22
        - exceptiongroup >=1.2.2        # [py<311]
        - importlib-metadata            # [py<310]
        - importlib-resources >=5.12.0  # [py<39]
        - litestar-htmx >=0.4.0
        - msgspec >=0.18.2
        - multidict >=6.0.2
        - multipart >=1.2.0
        - polyfactory >=2.6.3
        - pyyaml
        - click
        - rich >=13.0.0
        - rich-click
        - sniffio >=1.3.1
        - typing_extensions
      run_constrained:
        - jinja2>=3.1.2
        - pyjwt>=2.9.0
        - mako>=1.2.4
        - minijinja>=1.0.0
        - hiredis >=4.4.4,<5.3
        - advanced-alchemy>=0.2.2
        - valkey >=6.0.2
    test:
      imports:
        - litestar
      commands:
        - pip check
        - litestar --help
      requires:
        - pip
    about:
      home: https://litestar.dev
      dev_url: https://github.com/litestar-org/litestar
      doc_url: https://docs.litestar.dev
      summary: Light-weight and flexible ASGI API Framework
      description: |
        Litestar is a powerful, flexible yet opinionated ASGI framework, focused on building APIs.
        It offers high-performance data validation, dependency injection, first-class ORM integration,
        authorization primitives, a rich plugin API, middleware, and much more that's needed to get applications up and running.
      license: MIT
      license_family: MIT
      license_file: LICENSE

  - name: litestar-with-annotated-types
    requirements:
      build:
        - python
      run:
        - python
        - {{ pin_subpackage("litestar", exact=True) }}
        - annotated-types
    test:
      imports:
        - litestar
      commands:
        - pip check
      requires:
        - pip
    about:
      home: https://litestar.dev
      dev_url: https://github.com/litestar-org/litestar
      doc_url: https://docs.litestar.dev
      summary: Light-weight and flexible ASGI API Framework (with annotated-types)
      description: Light-weight and flexible ASGI API Framework (with annotated-types)
      license: MIT
      license_family: MIT
      license_file: LICENSE

  - name: litestar-with-attrs
    requirements:
      build:
        - python
      run:
        - {{ pin_subpackage("litestar", exact=True) }}
        - attrs
        - python
    test:
      imports:
        - litestar
        - litestar.contrib.attrs
      commands:
        - pip check
      requires:
        - pip
    about:
      home: https://litestar.dev
      dev_url: https://github.com/litestar-org/litestar
      doc_url: https://docs.litestar.dev
      summary: Light-weight and flexible ASGI API Framework (with attrs)
      description: Light-weight and flexible ASGI API Framework (with attrs)
      license: MIT
      license_family: MIT
      license_file: LICENSE

